<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Urbano 360 - Experiencias</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
</head>
<body>
  <!-- NAV -->
  <nav class="navbar navbar-expand-lg navbar-dark bg-dark sticky-top">
    <div class="container">
      <a class="navbar-brand fw-bold text-danger" href="index.html">URBANO 360</a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navMain">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="navMain">
        <ul class="navbar-nav ms-auto">
          <li class="nav-item"><a class="nav-link" href="index.html">Inicio</a></li>
          <li class="nav-item"><a class="nav-link active" href="experiencias.html">Experiencias</a></li>
          <li class="nav-item"><a class="nav-link" href="contacto.html">Contacto</a></li>
        </ul>
      </div>
    </div>
  </nav>

  <div class="container py-5">
    <h1 class="text-center mb-4">Cartelera y Gastronomía</h1>

    <!-- ACCORDION -->
    <div class="accordion" id="accExperiencias">
      
      <!-- PARTE 1: EVENTOS Y TABLA -->
      <div class="accordion-item">
        <h2 class="accordion-header">
          <button class="accordion-button" type="button" data-bs-toggle="collapse" data-bs-target="#item1">
            Eventos y Conciertos
          </button>
        </h2>
        <div id="item1" class="accordion-collapse collapse show" data-bs-parent="#accExperiencias">
          <div class="accordion-body">
            <table class="table table-hover table-striped">
              <thead class="table-dark">
                <tr><th>Fecha</th><th>Evento</th><th>Lugar</th><th>Precio</th></tr>
              </thead>
              <tbody>
                <tr><td>15 Oct</td><td>Indie Rock Fest</td><td>Foro Centro</td><td>$450 MXN</td></tr>
                <tr><td>18 Oct</td><td>Noche de Jazz</td><td>Terraza Bellavista</td><td>$320 MXN</td></tr>
              </tbody>
            </table>
          </div>
        </div>
      </div>

      <!-- PARTE 2: RUTA GASTRONOMICA Y CARDS -->
      <div class="accordion-item">
        <h2 class="accordion-header">
          <button class="accordion-button collapsed" type="button" data-bs-toggle="collapse" data-bs-target="#item2">
            Ruta Gastronómica
          </button>
        </h2>
        <div id="item2" class="accordion-collapse collapse" data-bs-parent="#accExperiencias">
          <div class="accordion-body">
            <div class="row g-4">
              <div class="col-md-4">
                <div class="card h-100">
                  <img src="https://images.unsplash.com/photo-1555396273-367ea4eb4db5?auto=format&fit=crop&w=600&q=80" class="card-img-top">
                  <div class="card-body">
                    <h5 class="card-title">Trattoria Bella Napoli</h5>
                    <p class="card-text">Pastas frescas artesanales y pizzas al horno de leña.</p>
                  </div>
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>

    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
